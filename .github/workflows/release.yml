name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # WallKraft uses ONE version across all platforms. A `v*` tag must match this
  # platform's version or the release is refused — so a one-sided version bump
  # fails CI instead of silently shipping a partial release.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: check
        run: |
          ANDROID_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          TAG="${{ github.ref_name }}"
          if [ "${TAG#v}" = "$ANDROID_VER" ]; then
            echo "Tag $TAG matches Android version $ANDROID_VER — releasing."
          else
            echo "::error::Tag $TAG does not match Android version $ANDROID_VER. All platforms must share the same version — bump android/app/build.gradle.kts (and windows/Cargo.toml) or fix the tag, then re-push."
            exit 1
          fi

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key
        # Decode the keystore from a GitHub secret and write key.properties so
        # assembleRelease signs with the real key. If the secrets are missing
        # (e.g. a fork), the build falls back to the debug keystore.
        env:
          KEYSTORE_B64: ${{ secrets.WALLKRAFT_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "::add-mask::${KEYSTORE_B64}"
            echo "::add-mask::${STORE_PW}"
            echo "::add-mask::${KEY_ALIAS}"
            echo "::add-mask::${KEY_PW}"
            echo "$KEYSTORE_B64" | base64 -d > wallkraft-release.keystore
            printf 'storeFile=wallkraft-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > key.properties
          fi

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: rename
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/WallKraft-${VERSION}-android-arm64.apk
          SIZE=$(du -h app/build/outputs/apk/release/WallKraft-${VERSION}-android-arm64.apk | cut -f1)
          echo "### APK Size: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "File: WallKraft-${VERSION}-android-arm64.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WallKraft ${{ github.ref_name }}
          body: |
            ## WallKraft ${{ github.ref_name }}

            A clean, fast, and private wallpaper browsing app powered by the
            [Wallhaven](https://wallhaven.cc) API. No ads, no analytics, no trackers.

            ### Downloads
            - `WallKraft-${{ steps.rename.outputs.version }}-android-arm64.apk` — Android (arm64)
            - `WallKraft-${{ steps.rename.outputs.version }}-windows-x64.exe` — Windows (x64)

            ### Install — Android
            1. Download the `.apk`
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Install — Windows
            1. Download the `.exe`
            2. Run it — portable, no installation required

            ### Features
            - Browse the Wallhaven library with search and filters
            - Staggered wallpaper grid with infinite scroll
            - Detail view: download, set as wallpaper, share, open on wallhaven.cc
            - Favorites (stored locally)
            - Settings: API key, theme, default sorting

            ### Notes
            - Android APK is signed with the WallKraft release key (arm64-only).
            - Windows build is a single self-contained executable.
          files: |
            android/app/build/outputs/apk/release/WallKraft-*.apk
