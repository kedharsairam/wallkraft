name: CI

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [master]
    paths: ['android/**', '.github/workflows/ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # kraft-foundation is public, so no credentials are needed. It sits beside the
        # repository root. Both settings.gradle.kts (inside android/) and the gate below
        # (run with working-directory android/) address it as ../kraft-foundation.
        # An earlier version said ../../, which escapes the repository and only worked
        # locally by accident. CI proved it wrong: dependabot runs failed with
        # MODULE_NOT_FOUND while local runs passed, which is the worst kind of green.
      - name: Checkout kraft-foundation (composite-build sibling)
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/kraft-foundation
          path: kraft-foundation


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            android/app/build
            android/build
            android/.gradle
          key: ${{ runner.os }}-android-build-${{ hashFiles('android/**/*.kt', 'android/**/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      # `quality.ci-runs-the-gate` fails if this step is removed.
      - name: Quality gate
        run: node ../kraft-foundation/tools/kraft-lint/kraft-lint.js . --format github

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: android/app/build/reports/jacoco/jacocoTestReport/html/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Check code style
        run: ./gradlew spotlessCheck --no-daemon

      - name: Report APK size
        if: github.event_name == 'pull_request'
        run: |
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/app-debug.apk >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "APK not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
