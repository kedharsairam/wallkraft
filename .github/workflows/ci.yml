name: CI

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [master]
    paths: ['android/**', '.github/workflows/ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            android/app/build
            android/build
            android/.gradle
          key: ${{ runner.os }}-android-build-${{ hashFiles('android/**/*.kt', 'android/**/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: android/app/build/reports/jacoco/jacocoTestReport/html/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Check code style
        run: ./gradlew spotlessCheck --no-daemon

      - name: Report APK size
        if: github.event_name == 'pull_request'
        run: |
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/app-debug.apk >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "APK not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
