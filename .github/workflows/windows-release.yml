name: Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # WallKraft uses ONE version across all platforms. A `v*` tag must match this
  # platform's version or the release is refused — so a one-sided version bump
  # fails CI instead of silently shipping a partial release.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: check
        run: |
          WIN_VER=$(grep -m1 '^version' windows/Cargo.toml | cut -d'"' -f2)
          TAG="${{ github.ref_name }}"
          if [ "${TAG#v}" = "$WIN_VER" ]; then
            echo "Tag $TAG matches Windows version $WIN_VER — releasing."
          else
            echo "::error::Tag $TAG does not match Windows version $WIN_VER. All platforms must share the same version — bump windows/Cargo.toml (and android/app/build.gradle.kts) or fix the tag, then re-push."
            exit 1
          fi

  release:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Rename EXE with version tag
        id: rename
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item target/release/wallkraft.exe "target/release/WallKraft-$version-windows-x64.exe"
          $size = (Get-Item "target/release/WallKraft-$version-windows-x64.exe").Length
          echo "### EXE Size: $([math]::Round($size / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
          echo "File: WallKraft-$version-windows-x64.exe" >> $env:GITHUB_STEP_SUMMARY

      - name: Cache NSIS
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3.12

      - name: Install NSIS
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # choco can return exit 0 while installing nothing (feed timeouts), so
          # retry until makensis.exe actually exists.
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $attempts = 0
          do {
            $attempts++
            choco install nsis --no-progress -y
            if (-not (Test-Path -LiteralPath $makensis)) { Start-Sleep -Seconds 10 }
          } while (-not (Test-Path -LiteralPath $makensis) -and $attempts -lt 5)
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "makensis not found after $attempts choco attempts"
          }
          Write-Host "NSIS installed at $makensis"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          # choco's nsis.install deploys to Program Files but doesn't add it to PATH
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis not found - is NSIS installed?" }
          & $makensis /DVERSION=$version /DEXE_PATH="target\release\wallkraft.exe" installer.nsi
          $size = (Get-Item "target/release/WallKraft-$version-setup.exe").Length
          echo "### Installer Size: $([math]::Round($size / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
          echo "File: WallKraft-$version-setup.exe" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: WallKraft ${{ github.ref_name }}
          body: |
            ## WallKraft ${{ github.ref_name }} (Windows)

            A clean, fast, and private wallpaper browser for Windows, powered by the
            [Wallhaven](https://wallhaven.cc) API. No ads, no analytics, no trackers.

            ### Downloads
            - `WallKraft-${{ steps.rename.outputs.version }}-setup.exe` — installer (recommended; per-user, no admin)
            - `WallKraft-${{ steps.rename.outputs.version }}-windows-x64.exe` — portable single-file build

            ### Install
            1. Download the `-setup.exe` installer (or run the portable exe directly)
            2. Run it — installs to `%LOCALAPPDATA%\Programs\WallKraft`, no admin required

            ### Features
            - Browse the Wallhaven library with search and filters
            - Staggered masonry grid with infinite scroll and first-load skeletons
            - Detail view: zoom, pan, copy URL, similar wallpapers
            - Set as wallpaper, favorites, slideshow, undo
            - System tray: show/hide, random, undo, quit
            - Drag any tile out to the desktop/folder to save the full-res image
            - Auto-update: checks GitHub releases on startup and updates in place
            - Offline-first: cached search results and favorites keep working offline
            - Dark / light / system theme, persisted

            ### Notes
            - Installer is a per-user NSIS build (no elevation).
            - The app self-updates; `winget upgrade --all` ignores it by design.
          files: windows/target/release/WallKraft-*.exe